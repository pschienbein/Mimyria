[build-system]
requires = ["setuptools", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mimyria"
dynamic = ["version"]
dependencies = [
  'ase',
  'numpy',
  'e3nn==0.5.6',
  'pyzstd',
  'pyyaml'
]

[project.scripts]
mimyria-py = "mimyria.cli:main"

[project.entry-points."ase.ioformats"]
polar = "mimyria.io:PolarIOFormat"

[tool.setuptools]
packages = ["mimyria"]
include-package-data = true

[tool.setuptools.package-data]
mimyria = ["models/**", "scripts/**", "templates/**"]

[tool.setuptools_scm]
version_file = "mimyria/_version.py"
